name: woodtong/dsh-ghostscreen-mcp
category: tools
tarball: https://github.com/woodtong/dsh-ghostscreen-mcp/releases/latest/download/dsh-ghostscreen-mcp.tgz
description:
  en: 'Mounts the GhostScreen MCP server into DSH sessions through the official MCP client bridge, registering its 21 mcp__ghostscreen__* tools: off-screen window capture (PrintWindow), window-message/UIA input that never steals focus, and headless-Edge web automation over CDP, with UIA actions gated on human consent. Ships no binary but auto-downloads the latest GhostScreen release on first start (disable with config.autoDownload); exe can also be located via config exePath, GHOSTSCREEN_MCP_EXE, or %LOCALAPPDATA%\GhostScreen.'
  zh: '通过官方 MCP 客户端桥接层把 GhostScreen 服务器接入 DSH，注册 21 个 mcp__ghostscreen__* 工具：屏幕外窗口捕获（PrintWindow）、不抢焦点的窗口消息/UIA 输入、基于 CDP 的无头 Edge 网页自动化，UIA 动作经人工同意门。插件不带二进制，但首次启动会自动下载最新 GhostScreen Release（config.autoDownload 可关）；exe 也可经 config、GHOSTSCREEN_MCP_EXE 或 %LOCALAPPDATA%\GhostScreen 定位。'
