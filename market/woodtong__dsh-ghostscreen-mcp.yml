name: woodtong/dsh-ghostscreen-mcp
category: tools
tarball: https://github.com/woodtong/dsh-ghostscreen-mcp/releases/latest/download/dsh-ghostscreen-mcp.tgz
description:
  en: 'Mounts the GhostScreen MCP server into DSH sessions through the official MCP client bridge, registering its 25 mcp__ghostscreen__* tools: off-screen window capture (PrintWindow), window-message/UIA input that never steals focus, and headless-Edge web automation over CDP, with UIA actions gated on human consent. Ships no binary: on every DSH start it checks the newest GhostScreen release, silently downloads the full package in the background, activates it on the next start and deletes older versions. The plugin page shows update progress and failures, warns when the unpacked package is missing a required binary, and exposes args/env/timeout settings; a local build can still be pinned via config.exePath or GHOSTSCREEN_MCP_EXE for development.'
  zh: '通过官方 MCP 客户端桥接层把 GhostScreen 服务器接入 DSH，注册 25 个 mcp__ghostscreen__* 工具：屏幕外窗口捕获（PrintWindow）、不抢焦点的窗口消息/UIA 输入、基于 CDP 的无头 Edge 网页自动化，UIA 动作经人工同意门。插件不带二进制：每次 DSH 启动都会检查最新 GhostScreen Release，在后台静默下载整包，下次启动自动启用并删除旧版本；插件页显示更新进度与失败原因，解压包缺必需文件时给出提示，并提供 args/env/超时配置；开发时仍可经 config.exePath 或 GHOSTSCREEN_MCP_EXE 固定本地构建。'
